name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'screenshots/**'
      - '.gitignore'
      - '.env.example'
      - 'metadata.json'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate App Icons
        run: |
          if [ -f "logo.png" ]; then
            mkdir -p assets
            cp logo.png assets/icon-only.png
            npx @capacitor/assets generate --android
          else
            echo "logo.png not found, skipping icon generation"
          fi

      - name: Build Web App
        run: |
          npm run build
          mkdir -p release-artifacts
          cd dist && zip -r ../release-artifacts/nedevcode-web.zip . && cd ..

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../release-artifacts/nedevcode.apk

      - name: Generate Version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            Automatic build of NedevCode.
            - **Web Version**: Standard HTML/JS build (zipped).
            - **Android APK**: Debug build for mobile installation.
          files: |
            release-artifacts/nedevcode-web.zip
            release-artifacts/nedevcode.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
